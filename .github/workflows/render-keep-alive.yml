name: Railway Backend Healthcheck

on:
  workflow_dispatch: # Manual trigger from the GitHub Actions tab

jobs:
  healthcheck:
    name: Ping Railway Spring Boot Backend
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL || secrets.RAILWAY_BACKEND_URL || 'https://beta-shoes-backend-production.up.railway.app' }}
    steps:
      - name: Ping Backend Health & Catalogue
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "RAILWAY_BACKEND_URL is not configured in repository variables/secrets. Skipping ping."
            exit 0
          fi

          BASE_URL="${BACKEND_URL%/}"
          echo "Pinging Railway backend ($BASE_URL) at $(date -u)..."
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE_URL/api/products?page=0&size=1")
          echo "API Products Response Code: $HTTP_STATUS"
          
          ACTUATOR_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$BASE_URL/actuator/health")
          echo "Actuator Health Response Code: $ACTUATOR_STATUS"
          
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$ACTUATOR_STATUS" -eq 200 ]; then
            echo "Success: Railway backend is healthy!"
          else
            echo "Warning: Received unexpected status from Railway backend."
          fi
